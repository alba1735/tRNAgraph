name: Release

# On-demand only -- deliberately NOT triggered on every push. Run manually from the Actions
# tab (or `gh workflow run release.yml -f branch=dev`) whenever a new tagged version/pre-release
# should be cut, per the branch selected. `dev` produces pre-releases (e.g. 1.9.0-alpha.1);
# `main` (once brought in sync with dev and used as the stable branch) produces final releases.
#
# `bump` defaults to `auto`, letting python-semantic-release derive the increment from the
# commit log. Do not casually change it to a forced level: forcing one defeats prerelease
# finalization, so `1.x.0-alpha.1` on dev becomes `1.(x+1).0` rather than `1.x.0` on main and
# the alpha's number is never released. PSR also weighs every tag in the repository, not just
# those reachable from the current branch, so an alpha tag raises the floor for a stable
# release even when it is not an ancestor of main. The patch/minor/major choices remain for a
# deliberate, considered override.
#
# --as-prerelease is passed whenever the branch is `dev`, and is NOT optional: forcing a bump
# level bypasses the prerelease determination that [tool.semantic_release.branches.dev] would
# otherwise apply, so `version --minor` alone yields a bare `1.11.0` off dev rather than
# `1.11.0-alpha.1`. It is a no-op when `bump` is `auto`. Note this is distinct from
# --prerelease, which yields the next prerelease of the CURRENT version (1.10.4-alpha.1).
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to release from (dev = pre-release, main = stable)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - main
      bump:
        description: "Version increment (auto = derive from commit log)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: pip install python-semantic-release

      - name: Configure git identity for the release commit
        run: |
          git config user.name "Alex Bagi"
          git config user.email "alexbagi24@gmail.com"

      - name: Run semantic-release (version bump, changelog, tag, GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ github.event.inputs.bump }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          set -euo pipefail
          args=()
          if [ "$BUMP" != "auto" ]; then
            args+=("--$BUMP")
          fi
          if [ "$BRANCH" = "dev" ]; then
            args+=("--as-prerelease")
          fi
          echo "+ semantic-release version ${args[*]-}"
          semantic-release version ${args[@]+"${args[@]}"}
