[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tRNAgraph"
dynamic = ["version"]
description = "tRNAgraph is a tool for for advanced analysis of tRNA-seq data."
readme = "README.md"
authors = [
    {name = "Alex Bagi", email = "abagi@ucsc.edu"}
]
license = {text = "GPL-3.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.12"
dependencies = [
  "adjustText==1.4.0",
  "anndata==0.12.6",
  "hdbscan==0.8.39",
  "logomaker==0.8.6",
  "matplotlib==3.9.1",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "pydeseq2==0.5.4",
  "pysam==0.23.3",
  "pysradb==2.5.1",
  "scikit-learn==1.7.2",
  "scipy==1.16.3",
  "seaborn==0.13.2",
  "typer==0.20.0",
  "umap-learn==0.5.9.post2"
]

[project.scripts]
trnagraph = "trnagraph.cli:app"

[tool.setuptools.dynamic]
version = {attr = "trnagraph.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trnagraph = ["assets/**/*"]