[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tRNAgraph"
dynamic = ["version"]
description = "tRNAgraph is a tool for for advanced analysis of tRNA-seq data."
readme = "README.md"
authors = [
    {name = "Alex Bagi", email = "abagi@ucsc.edu"}
]
license = {text = "GPL-3.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.12"
dependencies = [
  "adjustText==1.4.0",
  "anndata==0.12.6",
  "hdbscan==0.8.39",
  "logomaker==0.8.6",
  "matplotlib==3.9.1",
  "numpy==2.3.5",
  "packaging==25.0",
  "pandas==2.3.3",
  "pydantic==2.13.4",
  "pydeseq2==0.5.4",
  "pysam==0.23.3",
  "pysradb==2.5.1",
  "scikit-learn==1.7.2",
  "scipy==1.16.3",
  "seaborn==0.13.2",
  "typer==0.20.0",
  "umap-learn==0.5.9.post2"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "python-semantic-release"
]

[project.scripts]
trnagraph = "trnagraph.cli:app"

[tool.setuptools.dynamic]
version = {attr = "trnagraph.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trnagraph = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.semantic_release]
tag_format = "v{version}"
commit_parser = "conventional"
# Release commits are authored as the maintainer. Left unset, python-semantic-release
# commits as "semantic-release <semantic-release>", which registers as a second identity
# in the repository's contributor list.
commit_author = "Alex Bagi <alexbagi24@gmail.com>"
version_variables = [
    "src/trnagraph/__init__.py:__version__",
    # Keep the citation metadata's version in step with the release automatically. Zenodo
    # archives on a published GitHub Release and reads .zenodo.json; CITATION.cff drives
    # GitHub's own "Cite this repository" widget.
    "CITATION.cff:version",
    ".zenodo.json:version",
]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.dev]
match = "dev"
# dev is the pre-release channel: releases cut from it are suffixed '-alpha.N' and pip skips
# them unless --pre is passed, which is the intent. Stable x.y.z releases come from main.
# Note this requires main to actually be maintained -- it sat 106 commits behind dev during
# stabilization, and PSR computes from a branch's own tag history, so cutting a stable release
# from main is only meaningful once dev has been brought across.
prerelease = true
prerelease_token = "alpha"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"